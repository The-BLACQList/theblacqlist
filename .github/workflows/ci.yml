name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deliberately test:unit here, never the top-level `test` script — the
      # Playwright half runs in the `e2e` job below, which needs a browser,
      # a dev server, and database credentials this job has no reason to hold.
      - run: pnpm test:unit

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Scoped deliberately. The full e2e suite (a11y + contrast +
      # cross-browser) is not CI-ready — browser-rendering assertions against a
      # dev server flake, and a job that gets muted after its third false red is
      # worse than no job. This runs the specs that guard defects a green build
      # already shipped once:
      #   analytics-emission — the owner dashboard's Saves and Shares.
      #   security-headers   — response headers a signed audit claimed were
      #                        active while production served one of four.
      #   vendor-storefront  — every /vendors/<slug> 404'd on a bad PostgREST
      #                        embed. Asserts an HTTP status, not a layout.
      # Widened 2026-08-23 with three specs that meet the same bar — they
      # assert HTTP status, redirect target, or DOM validity state, never
      # layout:
      #   route-guards       — the six middleware-protected prefixes redirect
      #                        anonymous callers, and the public routes don't.
      #   api-contracts      — the analytics ingest and spend-privacy response
      #                        shapes (TA-17, TA-21).
      #   auth-validation    — native constraint validation on sign-up/sign-in
      #                        (validity.tooShort etc.), plus the two refusal
      #                        messages.
      # Still excluded on purpose: discovery-pages, owner-dashboard,
      # claim-workflow, account-surfaces, cross-browser, and the a11y/contrast
      # specs all assert on rendering against a dev server. Widen further only
      # as each is proven stable — a job that gets muted after its third false
      # red is worse than no job.
      - run: >-
          pnpm exec playwright test
          e2e/analytics-emission.spec.ts
          e2e/api-contracts.spec.ts
          e2e/auth-validation.spec.ts
          e2e/route-guards.spec.ts
          e2e/security-headers.spec.ts
          e2e/vendor-storefront.spec.ts
        env:
          # Same STAGING project the build job uses. The spec creates and then
          # deletes its own throwaway listing, so it never depends on — or
          # disturbs — seeded staging data. Production is never touched.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          # Without this every route 307s to /coming-soon and the spec cannot
          # reach a listing page at all.
          COMING_SOON_MODE: 'false'
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # Cloudflare's published always-pass TEST site key — not a credential,
          # safe in the clear (.env.example:117-119). It pairs with the matching
          # test SECRET configured on the STAGING Supabase project's Attack
          # Protection page; the two only work as a pair.
          #
          # Required, not optional: staging enforces project-level CAPTCHA on
          # /auth/v1/*, so without a rendered widget there is no
          # cf-turnstile-response token to send and every UI sign-in is rejected
          # — which is exactly how the whole e2e job went red on a comment-only
          # PR. e2e/helpers/auth.ts documents the matching wait this requires.
          #
          # Deliberately NOT setting TURNSTILE_SECRET_KEY: the app-side check
          # (lib/security/turnstile.ts) stays disabled here, matching production,
          # where the auth routes are guarded by Supabase rather than by the app.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Next.js incremental build cache — clears the "no build cache" warning
      # and speeds up repeat builds substantially.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # `next build` pre-renders routes that call createServiceClient(), so the
      # build needs real (staging) Supabase credentials. These are GitHub repo
      # secrets pointing at the STAGING project — never production values.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
